name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit          # domain logic, API client, AI proxy, server auth and accounts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e           # preview journeys + sign-in and accounts against the real server
      - run: npm run test:smoke
      - run: npm run test:a11y
      - run: npm audit --omit=dev --audit-level=moderate
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: for f in db/migrations/*.sql; do psql postgresql://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -f "$f"; done
